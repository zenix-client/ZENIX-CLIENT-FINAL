name: Inspect ZENIX Files

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inspect every repository file
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import zipfile
          import tarfile

          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d != ".git"]

              for name in files:
                  path = os.path.join(root, name)
                  size = os.path.getsize(path)

                  print(f"\nFILE: {path}")
                  print(f"SIZE: {size} bytes")

                  with open(path, "rb") as f:
                      header = f.read(32)

                  print(f"HEADER: {header.hex()}")

                  if zipfile.is_zipfile(path):
                      print("FORMAT: ZIP")
                      with zipfile.ZipFile(path) as archive:
                          for item in archive.namelist()[:25]:
                              print("  ", item)
                  elif tarfile.is_tarfile(path):
                      print("FORMAT: TAR")
                  elif header.startswith(b"PK"):
                      print("FORMAT: ZIP-like; archive needs inspection")
                  else:
                      print("FORMAT: other")
          PY
