name: Build ZENIX CLIENT

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract source archive
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          archive = Path("0b58782b-8211-4d51-b827-6e67d6a590e3.bin")
          if not archive.exists():
              raise SystemExit("Source archive not found")

          with zipfile.ZipFile(archive) as z:
              z.extractall("workspace")

          if not Path("workspace/zwork/build.gradle").exists():
              raise SystemExit("workspace/zwork/build.gradle not found")

          print("Source archive extracted successfully")
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'

      - name: Build project
        run: |
          cd workspace/zwork
          gradle --no-daemon clean build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZENIX-CLIENT-build
          path: |
            workspace/zwork/build/libs/*.jar
          if-no-files-found: error
