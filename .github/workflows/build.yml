name: Build ZENIX CLIENT

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract source archive
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import zipfile

          archives = [
              f for f in os.listdir(".")
              if f.endswith(".bin") and zipfile.is_zipfile(f)
          ]

          if not archives:
              raise SystemExit("ERROR: Source ZIP archive not found")

          for archive in archives:
              print("Extracting:", archive)
              with zipfile.ZipFile(archive) as z:
                  z.extractall("workspace")

          print("Extraction complete")
          PY

      - name: Inspect Gradle project
        shell: bash
        run: |
          echo "Project files:"
          find workspace -maxdepth 5 -type f | sort | head -200

          if [ ! -f workspace/zwork/build.gradle ]; then
            echo "ERROR: zwork/build.gradle not found"
            exit 1
          fi

      -       - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build project
        shell: bash
        run: |
          cd workspace/zwork
          ./gradlew --no-daemon clean build

      - name: Locate JAR
        shell: bash
        run: |
          mkdir -p output

          find workspace/zwork/build/libs -maxdepth 1 \
            -type f -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            -exec cp {} output/ \;

          if ! find output -name '*.jar' -print -quit | grep -q .; then
            echo "ERROR: No JAR generated"
            exit 1
          fi

          ls -lh output

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ZENIX-CLIENT-FINAL
          path: output/*.jar
          if-no-files-found: error
