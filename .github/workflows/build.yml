      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          WRAPPER="$(find . -type f -name gradlew \
            -not -path '*/.git/*' | head -n 1)"

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: gradlew not found"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$WRAPPER")"
          cd "$PROJECT_DIR"

          if [ ! -s gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Gradle Wrapper JAR is missing."
            echo "Checking wrapper properties..."

            if [ ! -f gradle/wrapper/gradle-wrapper.properties ]; then
              echo "ERROR: gradle-wrapper.properties is missing"
              exit 1
            fi

            cat gradle/wrapper/gradle-wrapper.properties
            exit 1
          fi

          chmod +x gradlew
          ./gradlew --version

      - name: Build JAR
        shell: bash
        run: |
          WRAPPER="$(find . -type f -name gradlew \
            -not -path '*/.git/*' | head -n 1)"

          PROJECT_DIR="$(dirname "$WRAPPER")"
          cd "$PROJECT_DIR"

          ./gradlew --no-daemon clean build
