name: Inspect ZENIX Files

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Inspect uploaded files
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import zipfile
          import tarfile
          import hashlib

          for name in os.listdir("."):
              if name.startswith(".") or not os.path.isfile(name):
                  continue

              size = os.path.getsize(name)
              print(f"\nFILE: {name}")
              print(f"SIZE: {size} bytes")

              with open(name, "rb") as f:
                  data = f.read(32)

              print(f"HEADER: {data[:16].hex()}")

              if zipfile.is_zipfile(name):
                  print("FORMAT: ZIP")
                  with zipfile.ZipFile(name) as z:
                      for item in z.namelist()[:40]:
                          print("  ", item)

              elif tarfile.is_tarfile(name):
                  print("FORMAT: TAR")
              else:
                  print("FORMAT: UNKNOWN / BINARY")

              print("SHA256:", hashlib.sha256(open(name, "rb").read()).hexdigest())
          PY
